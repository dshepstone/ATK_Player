name: Windows

# Windows is the current development target, so it is the only platform built in
# CI. macOS (M7) and Linux (M8) get their own workflow files in this directory
# when those milestones start -- deliberately separate files rather than a matrix,
# so a platform can be added without risking the one that already works.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.preset }})
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        preset: [windows-msvc-debug, windows-msvc-release]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # The tests cover atk_core only and need no display, so they run headless.
      - name: Test
        run: ctest --preset windows-msvc-debug --output-on-failure
        if: matrix.preset == 'windows-msvc-debug'

      # Proves the executable is actually runnable, not merely linkable -- a
      # missing Qt plugin only shows up at startup, never at link time.
      - name: Verify the application starts
        shell: pwsh
        run: |
          $exe = "build/${{ matrix.preset }}/bin/ATKPlayer.exe"
          if (-not (Test-Path $exe)) { throw "ATKPlayer.exe was not produced at $exe" }

          # No display on the runner, so use Qt's offscreen platform plugin.
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10

          if ($p.HasExited) {
            throw "ATKPlayer.exe exited on startup with code $($p.ExitCode)"
          }

          Write-Host "ATKPlayer.exe started and stayed running."
          Stop-Process -Id $p.Id -Force

      - name: Upload build output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATKPlayer-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/bin/
          retention-days: 7
          if-no-files-found: warn
