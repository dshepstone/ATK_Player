name: Windows

# Windows is the current development target, so it is the only platform built in
# CI. macOS (M7) and Linux (M8) get their own workflow files in this directory
# when those milestones start -- deliberately separate files rather than a matrix,
# so a platform can be added without risking the one that already works.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.preset }})
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        preset: [windows-debug, windows-release]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # Multimedia is not part of the base package and is required for
          # audio output.
          modules: qtmultimedia
          cache: true

      # install-qt-action exports QT_ROOT_DIR; the presets read QT_ROOT.
      - name: Point the build at the installed Qt
        shell: pwsh
        run: echo "QT_ROOT=$env:QT_ROOT_DIR" >> $env:GITHUB_ENV

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # msvc-dev-cmd supplies the compiler but not Ninja, and the presets use
      # the Ninja generator. Without this the configure fails with
      # "CMake was unable to find a build program corresponding to Ninja".
      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # vcpkg supplies FFmpeg. The runner ships a checkout already; use it
      # rather than cloning, so the toolchain path is stable.
      - name: Point the build at vcpkg
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not set on this runner"
          }
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          # FFmpeg's configure does not quote -libpath:, so the installed tree
          # must not sit under a path containing a space. The runner's workspace
          # has none, but pinning it keeps the build off any that might.
          echo "ATK_VCPKG_INSTALLED_DIR=C:/atkvcpkg" >> $env:GITHUB_ENV

      # The runner ships a vcpkg checkout, but not necessarily deep enough to
      # contain the baseline vcpkg.json pins. Without the commit present,
      # `git show <baseline>:versions/baseline.json` fails and the install
      # aborts. Fetching just that commit keeps the pin authoritative rather
      # than silently falling back to whatever the runner happens to have.
      - name: Fetch the pinned vcpkg baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          if (-not $baseline) { throw "vcpkg.json has no builtin-baseline" }
          Write-Host "Pinned baseline: $baseline"

          # Fetching an object that is already present is cheap, so this runs
          # unconditionally rather than probing first.
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch --depth 1 origin $baseline

          # Verify by the thing vcpkg actually does, rather than by an exit
          # code: it reads versions/baseline.json out of that commit.
          $probe = git -C "$env:VCPKG_INSTALLATION_ROOT" cat-file -t "$baseline"
          if ($probe -ne "commit") {
            throw "vcpkg baseline $baseline is still not available after fetching"
          }
          Write-Host "Baseline is present."

      # Building FFmpeg from source takes ten to twenty minutes, so the binary
      # artefacts are cached. The key covers the manifest and the pinned
      # baseline, which is exactly what determines the result.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # All suites run headless. The media integration tests decode fixtures
      # generated during the build by the ffmpeg tool vcpkg produced, so no
      # binary test media is committed and no audio device is needed -- audio is
      # only decoded and resampled here, never played.
      - name: Test
        run: ctest --preset windows-debug --output-on-failure
        if: matrix.preset == 'windows-debug'

      # Proves the executable is actually runnable, not merely linkable -- a
      # missing Qt plugin only shows up at startup, never at link time.
      - name: Verify the application starts
        shell: pwsh
        run: |
          $exe = "build/${{ matrix.preset }}/bin/ATKPlayer.exe"
          if (-not (Test-Path $exe)) { throw "ATKPlayer.exe was not produced at $exe" }

          # No display on the runner, so use Qt's offscreen platform plugin.
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10

          if ($p.HasExited) {
            throw "ATKPlayer.exe exited on startup with code $($p.ExitCode)"
          }

          Write-Host "ATKPlayer.exe started and stayed running."
          Stop-Process -Id $p.Id -Force

      - name: Upload build output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATKPlayer-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/bin/
          retention-days: 7
          if-no-files-found: warn
