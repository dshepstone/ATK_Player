name: Windows Release Package

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Version suffix (rc1 for acceptance; empty for final)'
        required: false
        default: 'rc1'
      publish:
        description: 'Publish the GitHub release (main only; builds the final version, ignoring the suffix). Creates the vX.Y.Z tag from CMakeLists.txt on this commit.'
        type: boolean
        required: false
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: Build Windows x64 MSI
    runs-on: windows-2022

    steps:
      - name: Check out exact ref
        uses: actions/checkout@v4

      - name: Install Qt 6.9.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Export Qt root
        shell: pwsh
        run: echo "QT_ROOT=$env:QT_ROOT_DIR" >> $env:GITHUB_ENV

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up pinned vcpkg
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          $root = 'C:/vcpkg-atk'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout --detach $baseline
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          echo "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          echo "ATK_VCPKG_INSTALLED_DIR=C:/atkvcpkg" >> $env:GITHUB_ENV

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: release-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Select version suffix
        id: version
        shell: pwsh
        run: |
          $suffix = '${{ inputs.version_suffix }}'
          # Publishing is always a final build, whatever the suffix field held
          # (an empty field can arrive as the 'rc1' default).
          if ('${{ inputs.publish }}' -eq 'true') { $suffix = '' }
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
            if ($tag -match '^v\d+\.\d+\.\d+-(.+)$') { $suffix = $Matches[1] }
            elseif ($tag -match '^v\d+\.\d+\.\d+$') { $suffix = '' }
            else { throw "Unsupported release tag: $tag" }
          }
          "suffix=$suffix" >> $env:GITHUB_OUTPUT

      - name: Build, test, stage and verify MSI
        shell: pwsh
        run: .\packaging\windows\build-installer.ps1 -VersionSuffix '${{ steps.version.outputs.suffix }}'

      - name: Upload MSI and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ATK-Player-Windows-x64-${{ github.sha }}
          path: |
            build/package/windows/*.msi
            build/package/windows/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    # Only a final release publishes, approved by the maintainer one of two
    # ways: pushing the final tag (vX.Y.Z, no suffix), or running this
    # workflow by hand on main with Publish ticked, which builds the final
    # version and creates that tag on the tested commit. rc tags and other
    # manual runs only build the MSI above.
    if: >-
      (github.ref_type == 'tag' && !contains(github.ref_name, '-'))
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      (inputs.publish == true || inputs.publish == 'true'))
    needs: package
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Check out exact ref
        uses: actions/checkout@v4

      - name: Download the tested MSI
        uses: actions/download-artifact@v4
        with:
          name: ATK-Player-Windows-x64-${{ github.sha }}
          path: build/package/windows

      - name: Package the release ZIP and text
        id: zip
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $match = Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION\s+(\d+\.\d+\.\d+)\s*$' | Select-Object -First 1
            if (-not $match) { throw 'No project VERSION found in CMakeLists.txt.' }
            $version = $match.Matches[0].Groups[1].Value
          }
          $template = "packaging/windows/github-release-$version.md"
          if (-not (Test-Path -LiteralPath $template)) { throw "Missing release text $template." }
          .\packaging\windows\make-release-zip.ps1 -ReleaseBodyTemplate $template
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.zip.outputs.version }}'
          $tag = "v$version"
          if ('${{ github.ref_type }}' -eq 'tag') {
            $where = @('--verify-tag')
          } else {
            # A manual publish makes the tag itself, on the commit just built
            # and tested. An existing tag means this version is already out.
            if (git ls-remote --tags origin "refs/tags/$tag") { throw "Tag $tag already exists." }
            $where = @('--target', '${{ github.sha }}')
          }
          gh release create $tag "build/package/release/ATK-Player-v$version-Windows.zip" `
            @where --title "ATK Player $version" --notes-file "build/package/release/RELEASE_BODY_v$version.md"
